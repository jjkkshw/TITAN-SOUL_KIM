<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720">
  <rect width="1000" height="720" fill="#171923"/>
  <style>
    text { font-family: Arial, sans-serif; fill: #f7fafc; text-anchor: middle; }
    .title { font-size: 30px; font-weight: 700; }
    .label { font-size: 23px; font-weight: 700; }
    .small { font-size: 18px; fill: #cbd5e0; }
    .edge { stroke: #0b0c12; stroke-width: 5; stroke-linejoin: round; }
  </style>

  <text x="500" y="45" class="title">EyeCube 좌우 90° 회전 후보</text>
  <text x="500" y="78" class="small">시작 자세: 윗면 파랑 / 정면 보라</text>

  <rect x="35" y="105" width="930" height="250" rx="18" fill="#242735"/>
  <text x="110" y="140" class="label">A. 현재 방식</text>
  <text x="315" y="140" class="small">왼쪽 이동</text>
  <text x="685" y="140" class="small">오른쪽 이동</text>
  <text x="500" y="245" class="label">←</text>
  <text x="500" y="285" class="small">서로 반대 방향으로 굴림</text>

  <!-- A left: blue top, green front -->
  <g transform="translate(315 230)">
    <polygon class="edge" fill="#3373ff" points="0,-70 95,-25 0,20 -95,-25"/>
    <polygon class="edge" fill="#2fbf4f" points="-95,-25 0,20 0,120 -95,75"/>
    <polygon class="edge" fill="#7c3fe0" points="0,20 95,-25 95,75 0,120"/>
  </g>
  <!-- A right: blue top, red front -->
  <g transform="translate(685 230)">
    <polygon class="edge" fill="#3373ff" points="0,-70 95,-25 0,20 -95,-25"/>
    <polygon class="edge" fill="#7c3fe0" points="-95,-25 0,20 0,120 -95,75"/>
    <polygon class="edge" fill="#ef3333" points="0,20 95,-25 95,75 0,120"/>
  </g>

  <rect x="35" y="385" width="930" height="250" rx="18" fill="#242735"/>
  <text x="110" y="420" class="label">B. 반대 방식</text>
  <text x="315" y="420" class="small">왼쪽 이동</text>
  <text x="685" y="420" class="small">오른쪽 이동</text>
  <text x="500" y="525" class="label">←</text>
  <text x="500" y="565" class="small">A의 회전 방향을 좌우 모두 반전</text>

  <!-- B left: blue top, red front -->
  <g transform="translate(315 510)">
    <polygon class="edge" fill="#3373ff" points="0,-70 95,-25 0,20 -95,-25"/>
    <polygon class="edge" fill="#7c3fe0" points="-95,-25 0,20 0,120 -95,75"/>
    <polygon class="edge" fill="#ef3333" points="0,20 95,-25 95,75 0,120"/>
  </g>
  <!-- B right: blue top, green front -->
  <g transform="translate(685 510)">
    <polygon class="edge" fill="#3373ff" points="0,-70 95,-25 0,20 -95,-25"/>
    <polygon class="edge" fill="#2fbf4f" points="-95,-25 0,20 0,120 -95,75"/>
    <polygon class="edge" fill="#7c3fe0" points="0,20 95,-25 95,75 0,120"/>
  </g>

  <text x="500" y="690" class="small">A 또는 B를 선택하면 해당 회전 방향을 코드에 적용합니다.</text>
</svg>
